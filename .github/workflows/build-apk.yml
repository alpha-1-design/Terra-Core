name: Build Terra-Core APK

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run build

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npx cap sync android

      - run: chmod +x android/gradlew

      # Reuse a stable signing key when ANDROID_KEYSTORE_BASE64 is set (so
      # users can install newer release APKs over older ones). Without it, an
      # ephemeral key is generated — fine for debug/testing, but reinstalls
      # over an earlier release will hit a signature mismatch.
      - name: Restore or generate release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          else
            keytool -genkey -v -keystore android/app/release.keystore \
              -alias terra -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 'terra-core-2026' -keypass 'terra-core-2026' \
              -dname "CN=Terra Core, OU=Alpha-1, O=Alpha-1 Design, L=Kumasi, ST=Ashanti, C=GH"
          fi

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: terra-core-debug-${{ github.ref_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: terra-core-release-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk