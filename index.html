  <!-- Structured data -->

      "@context": "https://schema.org",

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet"
  />
</head>

<body>
  <div id="root"></div>
  <script>
  // Optional desktop site view for APK - toggle via localStorage
  const desktopView = localStorage.getItem('terra-desktop-view');
  const viewportMeta = document.getElementById('viewport-meta');
  
  if (desktopView === 'true' && viewportMeta) {
    viewportMeta.content = 'width=1200, initial-scale=0.5, user-scalable=yes';
  }
  
  // Toggle function for desktop view
  window.toggleDesktopView = function() {
    const isDesktop = viewportMeta.content.includes('width=1200');
    localStorage.setItem('terra-desktop-view', !isDesktop);
    viewportMeta.content = !isDesktop ? 'width=1200, initial-scale=0.5, user-scalable=yes' : 'width=device-width, initial-scale=1.0, user-scalable=yes';
  };
</script>

<script type="module" src="/src/main.tsx"></script>
</body>

</html>
